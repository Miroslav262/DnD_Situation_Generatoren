name: Deploy DnD_Situation_Generator

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Set up .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet publish -c Release -o out

    - name: Build Docker image
      run: docker build -t ${{ secrets.DOCKER_USERNAME }}/dndsitgen:latest .

    - name: Login to Docker Hub
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    - name: Push image
      run: docker push ${{ secrets.DOCKER_USERNAME }}/dndsitgen:latest

    - name: Deploy to server via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          mkdir -p ~/.dpkeys

          docker pull ${{ secrets.DOCKER_USERNAME }}/dndsitgen:latest
          
          docker rm -f dndsitgen || true
          
          docker run -d \
            --name dndsitgen \
            --restart unless-stopped \
            -p 8082:8080 \
            -v ~/.dpkeys:/root/.aspnet/DataProtection-Keys \
            -e Groq__ApiKey="${{ secrets.GROQ_API_KEY }}" \
            -e ConnectionStrings__Default="${{ secrets.DB_CONNECTION_STRING }}" \
            -e Jwt__Key="${{ secrets.JWT_KEY }}" \
            -e Jwt__Issuer="${{ secrets.JWT_ISSUER }}" \
            -e Jwt__Audience="${{ secrets.JWT_AUDIENCE }}" \
            ${{ secrets.DOCKER_USERNAME }}/dndsitgen:latest
